<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <filter id="paper" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="grey"/>
      <feComponentTransfer in="grey" result="grain">
        <feFuncA type="linear" slope="0.16"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="grain" mode="multiply"/>
    </filter>
    <filter id="crayon" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.32 0.62" numOctaves="4" seed="31" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="12" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feTurbulence type="fractalNoise" baseFrequency="1.4" numOctaves="2" seed="4" result="micro"/>
      <feColorMatrix in="micro" type="saturate" values="0" result="microg"/>
      <feComponentTransfer in="microg" result="mask">
        <feFuncA type="table" tableValues="0.68 1"/>
      </feComponentTransfer>
      <feComposite in="d" in2="mask" operator="in" result="textured"/>
      <feMerge><feMergeNode in="d"/><feMergeNode in="textured"/></feMerge>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="0.6"/></filter>
  </defs>

  <rect width="1024" height="1024" fill="#eeeae0"/>
  <rect width="1024" height="1024" fill="#f3efe6" filter="url(#paper)"/>

  <g filter="url(#crayon)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- bleu : souffle central et grandes arches -->
    <path d="M509 726 C498 600 492 455 499 253" stroke="#2f6fb0" stroke-width="21" opacity="0.8"/>
    <path d="M518 724 C512 590 520 420 534 165" stroke="#3c7cbb" stroke-width="14" opacity="0.75"/>
    <path d="M492 728 C477 611 466 493 470 371" stroke="#2c6aa9" stroke-width="16" opacity="0.9"/>
    <path d="M532 724 C575 561 639 361 731 215" stroke="#2f74b5" stroke-width="20" opacity="0.8"/>
    <path d="M545 727 C622 542 746 356 886 205" stroke="#3d7fbe" stroke-width="17" opacity="0.78"/>
    <path d="M551 728 C664 575 815 397 947 187" stroke="#2e6fae" stroke-width="12" opacity="0.88"/>
    <path d="M546 729 C638 607 773 458 914 401" stroke="#4a88c5" stroke-width="11" opacity="0.8"/>

    <!-- rouge -->
    <path d="M598 723 C612 590 643 393 716 247" stroke="#d92b2b" stroke-width="25" opacity="0.95"/>
    <path d="M619 721 C651 570 707 393 784 269" stroke="#e33430" stroke-width="19" opacity="0.9"/>
    <path d="M640 716 C689 561 762 423 856 321" stroke="#d12727" stroke-width="19" opacity="0.9"/>
