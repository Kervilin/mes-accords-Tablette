    <path d="M667 728 C696 645 741 546 802 481" stroke="#3c6eb2" stroke-width="12" opacity="0.8"/>
    <path d="M706 726 C728 648 763 580 819 521" stroke="#464da5" stroke-width="17" opacity="0.85"/>
    <path d="M730 728 C754 647 791 572 803 548" stroke="#2f6aa8" stroke-width="13" opacity="0.8"/>
  </g>

