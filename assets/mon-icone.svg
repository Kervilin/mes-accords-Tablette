    <path d="M464 729 C467 620 481 505 512 416" stroke="#e6c22b" stroke-width="13" opacity="0.88"/>
    <path d="M438 726 C445 627 478 517 545 437" stroke="#efcc34" stroke-width="10" opacity="0.8"/>

    <!-- bleu/violet à gauche -->
