# Déploiement Netlify — « Mes accords »
# Place ce fichier à la RACINE du dépôt, ou garde-le ici et renseigne
# « Base directory » = racine du projet dans Netlify.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Le service worker et le manifest doivent être servis sans cache long
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# SPA : tout retombe sur index.html (sauf les fichiers existants)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
